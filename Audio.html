<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<!-- Agora Web SDK v4 UMD build (global AgoraRTC). Multi-CDN fallback. -->
<script>
(function(){
  var URLS = [
    'https://cdn.jsdelivr.net/npm/agora-rtc-sdk-ng@4.24.8/dist/AgoraRTC_N-production.js',
    'https://unpkg.com/agora-rtc-sdk-ng@4.24.8/dist/AgoraRTC_N-production.js',
    'https://download.agora.io/sdk/release/AgoraRTC_N-4.21.0.js'
  ];
  function tryLoad(i){
    if (i >= URLS.length){ window._agoraFailed = true; return; }
    var s = document.createElement('script');
    s.src = URLS[i];
    s.onload = function(){ window._agoraLoaded = true; };
    s.onerror = function(){ s.remove(); tryLoad(i+1); };
    document.head.appendChild(s);
  }
  tryLoad(0);
})();
</script>
<style>
  :root{--bg:#fff;--fg:#162033;--muted:#5f6b80;--accent:#2563eb;--accent-2:#1d4ed8;--ok:#16a34a;--err:#dc2626;--r:10px;
        --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;padding:14px;font-family:var(--font);font-size:13px;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
  h4{font-size:11px;font-weight:600;color:var(--muted);margin:0 0 8px;letter-spacing:.01em;text-transform:uppercase}
  .room-info{font-size:12px;color:var(--muted);background:#f5f8fc;border:1px solid #e1e6f0;border-radius:8px;padding:8px 10px;margin-bottom:10px;line-height:1.5}
  .room-info b{color:var(--fg)}
  .status{font-size:12px;padding:8px 10px;border-radius:8px;background:#f5f8fc;color:var(--muted);border:1px solid transparent;white-space:pre-wrap;min-height:18px;margin-bottom:10px;line-height:1.5}
  .status.ok{color:var(--ok);background:#e7f6ec;border-color:rgba(22,163,74,.25)}
  .status.err{color:var(--err);background:#fdecec;border-color:rgba(220,38,38,.25)}
  .row{display:flex;gap:8px;margin:8px 0}
  button{flex:1;font:inherit;font-size:13px;font-weight:500;color:var(--fg);background:#fff;border:1px solid #cdd6e6;border-radius:10px;padding:10px;cursor:pointer;transition:background 140ms,transform 140ms}
  button:hover{background:#eaf0fa;border-color:var(--accent)}
  button:active{transform:scale(.985)}
  button.primary{color:#fff;background:var(--accent);border-color:transparent;font-weight:600}
  button.primary:hover{background:var(--accent-2)}
  button:disabled{opacity:.5;cursor:default}
  .participants{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
  .participants .you{color:var(--accent-2);font-weight:600}
  .hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.45}
</style>
</head>
<body>
  <h4>语音通话 · Agora</h4>
  <div class="room-info" id="roomInfo">频道: 连接中…</div>
  <div class="status" id="status">初始化…</div>
  <div class="row">
    <button class="primary" id="muteBtn">🎤 静音</button>
    <button id="leaveBtn">离开频道</button>
  </div>
  <div class="participants" id="participants"></div>
  <div class="hint">token 在本窗口用 Web Crypto 签发（App Certificate 写在本文件里，仅你的项目可见）。</div>

  <script>
    var $ = function(id){ return document.getElementById(id); };
    function setStatus(msg, cls){ var s=$('status'); s.textContent=msg; s.className='status '+(cls||''); }
    function setRoom(msg){ $('roomInfo').innerHTML=msg; }
    function esc(s){ return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

    /* ============ Agora AccessToken2 (Token007) — ported from official
       agora-token npm src/AccessToken2.js + RtcTokenBuilder2.js.
       Uses Web Crypto for HMAC-SHA256 (binary keys) + manual stored zlib
       deflate (no CompressionStream needed). ============ */

    // your Agora credentials (from the Agora console)
    var AGORA_APP_ID = '6fb557c64dc04c578ea45bbc0f29cac0';
    var AGORA_APP_CERT = '8d95c2dad6214253b87e55592de978da';

    function utf8Bytes(s){ var u = unescape(encodeURIComponent(s)); var b=[]; for(var i=0;i<u.length;i++) b.push(u.charCodeAt(i)); return b; }
    function concatBytes(arrays){ var total=0; arrays.forEach(function(a){total+=a.length;}); var out=new Uint8Array(total); var off=0; arrays.forEach(function(a){out.set(a,off); off+=a.length;}); return out; }
    function bytesToB64(bytes){ var s=''; for(var i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]); return btoa(s); }

    // little-endian byte buffer writer (matches the npm ByteBuf)
    function ByteBuf(){ var b=[];
      this.putUint16=function(v){ b.push(v&0xff,(v>>8)&0xff); return this; };
      this.putUint32=function(v){ b.push(v&0xff,(v>>8)&0xff,(v>>16)&0xff,(v>>>24)&0xff); return this; };
      this.putBytes=function(arr){ var a = arr instanceof Uint8Array ? Array.from(arr) : arr; this.putUint16(a.length); for(var i=0;i<a.length;i++) b.push(a[i]&0xff); return this; };
      this.putString=function(s){ return this.putBytes(utf8Bytes(s)); };
      this.putTreeMapUInt32=function(m){ var keys=Object.keys(m); this.putUint16(keys.length); for(var i=0;i<keys.length;i++){ this.putUint16(parseInt(keys[i],10)); this.putUint32(m[keys[i]]); } return this; };
      this.pack=function(){ return new Uint8Array(b); };
      return this;
    }

    // HMAC-SHA256(key, message) → Uint8Array(32). Async via Web Crypto.
    async function hmacSha256(keyBytes, msgBytes){
      var k = keyBytes instanceof Uint8Array ? keyBytes : new Uint8Array(keyBytes);
      var m = msgBytes instanceof Uint8Array ? msgBytes : new Uint8Array(msgBytes);
      var ck = await crypto.subtle.importKey('raw', k, {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
      var sig = await crypto.subtle.sign('HMAC', ck, m);
      return new Uint8Array(sig);
    }

    function adler32(bytes){ var a=1,b=0; for(var i=0;i<bytes.length;i++){ a=(a+bytes[i])%65521; b=(b+a)%65521; } return ((b<<16)|a)>>>0; }

    // zlib-format deflate using a single STORED block (valid, decodes to original).
    // data length must be ≤ 65535 (our token content is ~100 bytes).
    function zlibDeflateStored(data){
      var len = data.length, nlen = (~len) & 0xffff;
      var out = [0x78, 0x01, 0x01, len&0xff, (len>>8)&0xff, nlen&0xff, (nlen>>8)&0xff];
      for(var i=0;i<len;i++) out.push(data[i]);
      var ad = adler32(data);
      out.push((ad>>>24)&0xff, (ad>>16)&0xff, (ad>>8)&0xff, ad&0xff);
      return new Uint8Array(out);
    }

    // ServiceRtc.pack(): type(1) + privileges(map) + channel + uid
    function packServiceRtc(channelName, uid, privilegeExpire){
      var typeBuf = new ByteBuf().putUint16(1).pack(); // kRtcServiceType = 1
      var priv = {};
      priv[1] = privilegeExpire; // joinChannel
      priv[2] = privilegeExpire; // publishAudio
      priv[3] = privilegeExpire; // publishVideo
      priv[4] = privilegeExpire; // publishData
      var privBuf = new ByteBuf().putTreeMapUInt32(priv).pack();
      var cnBuf = new ByteBuf().putString(channelName).pack();
      var uidStr = (uid === 0 || uid == null) ? '' : String(uid);
      var uidBuf = new ByteBuf().putString(uidStr).pack();
      return concatBytes([typeBuf, privBuf, cnBuf, uidBuf]);
    }

    // Build a Token007 RTC token. Async (Web Crypto).
    async function buildAgoraToken(channelName, uid){
      var issueTs = Math.floor(Date.now()/1000);
      var expire = 3600; // token valid 1 hour
      var salt = Math.floor(Math.random()*99999999)+1;
      // signing = HMAC(issueTs, appCert) then HMAC(salt, that)
      var signing1 = await hmacSha256(new ByteBuf().putUint32(issueTs).pack(), utf8Bytes(AGORA_APP_CERT));
      var signing = await hmacSha256(new ByteBuf().putUint32(salt).pack(), signing1);
      // signing_info = putString(appId) + putUint32(issueTs) + putUint32(expire) + putUint32(salt) + putUint16(1) + serviceRtc.pack()
      var svc = packServiceRtc(channelName, uid, expire);
      var si = new ByteBuf().putString(AGORA_APP_ID).putUint32(issueTs).putUint32(expire).putUint32(salt).putUint16(1).pack();
      si = concatBytes([si, svc]);
      // signature = HMAC(signing, signing_info)
      var signature = await hmacSha256(signing, si);
      // content = putBytes(signature) + signing_info
      var content = concatBytes([new ByteBuf().putBytes(signature).pack(), si]);
      // compressed = zlib deflate (stored)
      var compressed = zlibDeflateStored(content);
      return '007' + bytesToB64(compressed);
    }

    /* ============ Agora audio room (join with token) ============ */
    var client=null, localAudio=null, channel='', uid=0;
    var remoteUsers = {};
    var _startRetries = 0;

    function renderParticipants(){
      var html='<div class="you">🎤 你 (uid '+uid+') — '+ (localAudio ? (localAudio.muted?'静音':'开麦') : '加入中') +'</div>';
      Object.keys(remoteUsers).forEach(function(k){ html+='<div>🎧 对方 (uid '+esc(k)+')</div>'; });
      $('participants').innerHTML=html;
    }

    async function startAudio(){
      if (typeof AgoraRTC === 'undefined'){
        if (window._agoraFailed){ setStatus('Agora SDK 三个 CDN 都没加载。检查网络/代理是否放行 cdn.jsdelivr.net / unpkg.com / download.agora.io。', 'err'); return; }
        if (_startRetries++ > 20){ setStatus('Agora SDK 加载超时（20 秒）。', 'err'); return; }
        setStatus('Agora SDK 加载中…');
        setTimeout(startAudio, 500);
        return;
      }
      try { client = AgoraRTC.createClient({mode:'rtc', codec:'vp8'}); }
      catch(e){ setStatus('createClient 失败: '+e.message, 'err'); return; }
      client.on('user-published', function(user, mediaType){
        setStatus('对方加入: uid '+user.uid+'，订阅中…');
        client.subscribe(user, mediaType).then(function(){
          if (mediaType==='audio' && user.audioTrack) user.audioTrack.play();
          remoteUsers[user.uid]=user; renderParticipants();
          setStatus('✓ 对方 (uid '+user.uid+') 已订阅，能听到对方了。', 'ok');
        }).catch(function(e){ setStatus('订阅对方失败: '+e.message, 'err'); });
      });
      client.on('user-unpublished', function(user){ delete remoteUsers[user.uid]; renderParticipants(); setStatus('对方离开: uid '+user.uid); });
      setRoom('频道: <b>'+esc(channel)+'</b> · App ID: <b>'+AGORA_APP_ID.slice(0,8)+'…</b> · uid: <b>'+uid+'</b>');
      // mint token (async, Web Crypto)
      setStatus('签发 token 中…');
      var token;
      try { token = await buildAgoraToken(channel, uid); }
      catch(e){ setStatus('token 签发失败: '+e.message, 'err'); return; }
      setStatus('加入频道中（带 token）…');
      client.join(AGORA_APP_ID, channel, token, uid).then(function(joinedUid){
        uid = joinedUid;
        setStatus('已加入频道 ✓，请求麦克风…');
        return AgoraRTC.createMicrophoneAudioTrack();
      }).then(function(track){
        localAudio = track;
        client.publish(track);
        setStatus('✓ 已加入 + 麦克风开。说话对方能听到；对方说话你也能听到。', 'ok');
        renderParticipants();
      }).catch(function(e){
        var msg = e.message || String(e); if (e && e.code) msg += ' (code '+e.code+')';
        setStatus('加入/麦克风失败: '+msg, 'err');
      });
    }

    $('muteBtn').addEventListener('click', function(){
      if (!localAudio) return;
      var muted = !localAudio.muted;
      localAudio.setMuted(muted);
      $('muteBtn').textContent = muted ? '🔇 取消静音' : '🎤 静音';
      renderParticipants();
    });
    $('leaveBtn').addEventListener('click', function(){
      try { if (localAudio) localAudio.stop(); } catch(e){}
      try { if (client) client.leave(); } catch(e){}
      localAudio=null; client=null; remoteUsers={};
      setStatus('已离开频道。'); renderParticipants();
    });

    // on load: PF_CONFIG (popup+write) → URL ?channel= (GitHub Pages top-level) → google.script.run (modeless fallback)
    function bootstrap(){ uid = Math.floor(Math.random()*100000); startAudio(); }
    var urlChannel = new URLSearchParams(location.search).get('channel');
    if (window.PF_CONFIG && PF_CONFIG.channel){ channel = PF_CONFIG.channel; bootstrap(); }
    else if (urlChannel){ channel = urlChannel; bootstrap(); }
    else {
      google.script.run.withSuccessHandler(function(rid){ channel='pfdebate-'+rid; bootstrap(); })
        .withFailureHandler(function(e){ setStatus('getRoundId 失败: '+e.message, 'err'); }).getRoundId();
    }
    renderParticipants();
  </script>
</body>
</html>
