<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;color:#1a1a2e;background:#f5f6fa;height:100vh;display:flex;flex-direction:column;overflow:hidden}
/* Claim */
.claim{position:fixed;inset:0;background:#f5f6fa;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:20px}
.claim h2{font-size:22px;margin-bottom:16px;color:#1a1a2e}
.claim input{border:1px solid #d0d4e0;border-radius:8px;padding:8px 12px;font-size:14px;width:260px;margin-bottom:8px}
.claim-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:320px;margin-top:8px}
.cb{background:#fff;border:2px solid #d0d4e0;border-radius:12px;padding:14px;text-align:center;cursor:pointer;font-size:14px;font-weight:600;color:#1a1a2e;transition:.2s}
.cb.pro{border-color:#2563eb}.cb.con{border-color:#dc2626}.cb.judge{border-color:#f59e0b}.cb.aud{border-color:#888;grid-column:span 2}
.cb:hover{background:#f0f4ff}.cb:disabled{opacity:.3}
.cs{color:#666;font-size:12px;margin-top:10px;text-align:center;max-width:400px}.cs.err{color:#dc2626}
.rb{background:none;border:0;color:#888;font-size:12px;cursor:pointer;margin-top:8px;text-decoration:underline}
.fb-fb{margin-top:10px;text-align:center;display:none}.fb-fb input{width:280px}.fb-fb button{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:6px 14px;cursor:pointer}
/* Room */
.room{display:none;flex:1;flex-direction:column;overflow:hidden}
.topic-bar{background:#fff;padding:8px 16px;text-align:center;border-bottom:1px solid #e0e0e8}
.topic-bar .topic{font-size:24px;font-weight:700;color:#1a1a2e}
.topic-bar .vs{font-size:11px;color:#888;margin-top:2px}
.judge-row{display:flex;justify-content:center;padding:8px;background:#fffceb;border-bottom:1px solid #f0e0a0}
.main-row{flex:1;display:flex;overflow:hidden}
.team{flex:1;padding:12px;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center}
.team.pro{background:#f0f4ff}.team.con{background:#fef0f0}
.center-panel{flex:0 0 300px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:8px}
/* Avatar */
.avatar{width:96px;height:96px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;overflow:hidden;position:relative;border:3px solid transparent;transition:.3s}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar video{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar.speaking{border-color:#22c55e;box-shadow:0 0 16px rgba(34,197,94,.7);animation:avpulse 1.2s ease-in-out infinite}@keyframes avpulse{0%,100%{box-shadow:0 0 8px rgba(34,197,94,.4)}50%{box-shadow:0 0 20px rgba(34,197,94,.85)}}
.avatar.muted{opacity:.4}
.avatar.judge{width:72px;height:72px;font-size:24px;background:#f59e0b}
.debater{text-align:center}
.debater .name{font-size:13px;font-weight:600;color:#1a1a2e;margin-top:4px}
.debater .role{font-size:10px;color:#888}
.debater .status{font-size:10px;margin-top:2px}
.debater .status.on{color:#22c55e}.debater .status.off{color:#999}
.debater .perm{font-size:10px;margin-top:1px}.debater .perm.y{color:#22c55e}.debater .perm.n{color:#999}
.perm-btn{background:#e0e0e0;border:0;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;color:#333}
.perm-btn.on{background:#22c55e;color:#fff}.perm-btn.off{background:#ccc;color:#888}
.audio-bar{width:84px;height:8px;background:#e8ecf2;border-radius:4px;margin-top:6px;overflow:hidden;border:1px solid #cdd3e0}
.audio-fill{height:100%;width:0;background:#22c55e;transition:width .1s}
/* Timer */
.timer-num{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;color:#1a1a2e;line-height:1}
.timer-num.warn{color:#f59e0b}.timer-num.done{color:#dc2626}
.progress-track{width:240px;height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;background:#22c55e;transition:width 1s linear}
.progress-fill.warn{background:#f59e0b}.progress-fill.done{background:#dc2626}
.judge-ctrl{display:none;gap:6px;margin-top:8px}
.judge-ctrl button{background:#1a1a2e;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:16px;cursor:pointer}
.judge-ctrl button:hover{background:#2a2a4e}
.now-speaking{font-size:12px;color:#22c55e;font-weight:600;text-align:center;margin-top:4px}
.next-up{font-size:11px;color:#888;text-align:center}
/* Chat */
.chat-bar{height:120px;display:flex;flex-direction:column;background:#fff;border-top:1px solid #e0e0e8}
.chat-head{padding:4px 12px;font-size:11px;color:#888;border-bottom:1px solid #f0f0f4}
.chat-list{flex:1;overflow-y:auto;padding:4px 12px}
.chat-msg{font-size:12px;margin:2px 0}.chat-msg b{color:#2563eb;margin-right:3px}.chat-msg.me b{color:#22c55e}
.chat-msg.sys{color:#888;font-size:11px;font-style:italic}
.chat-input{display:flex;gap:4px;padding:4px}
.chat-input input{flex:1;border:1px solid #d0d4e0;border-radius:6px;padding:4px 8px;font-size:12px}
.chat-input button{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
/* Footer */
.footer{background:#1a1a2e;padding:6px 14px;display:flex;align-items:center;gap:8px}
.footer button{background:#2a2a4e;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:16px;cursor:pointer}
.footer .st{flex:1;font-size:11px;color:#888}.footer .st.ok{color:#22c55e}.footer .st.err{color:#ef4444}
</style>

</div>

<script>

/* Token port */
function utf8B(s){var u=unescape(encodeURIComponent(s)),b=[];for(var i=0;i<u.length;i++)b.push(u.charCodeAt(i));return b}
function cat(a){var t=0;a.forEach(function(x){t+=x.length});var o=new Uint8Array(t),f=0;a.forEach(function(x){o.set(x,f);f+=x.length});return o}

async function mkToken(cn,uid){var ts=Math.floor(Date.now()/1000),exp=3600,salt=Math.floor(Math.random()*99999999)+1;var s1=await hmac(new BB().u32(ts).pack(),utf8B(APP_CERT));var sg=await hmac(new BB().u32(salt).pack(),s1);var svc=packSvc(cn,uid,exp);var si=cat([new BB().str(APP_ID).u32(ts).u32(exp).u32(salt).u16(1).pack(),svc]);var sig=await hmac(sg,si);var ct=cat([new BB().bytes(sig).pack(),si]);return'007'+b64(zlibDef(ct))}
/* State */
var params=new URLSearchParams(location.search);var channel=params.get('channel')||'pfdebate-default';var fbUrl=params.get('fbUrl')||'';
var myRole=null,myUid=0,myName='',myAvatar='';var seats={},curPhase=1,desiredSub=new Set();
var client=null,mic=null,cam=null,camEnabled=false;var timerEndsAt=0,timerRunning=false,timerDur=0,timerRem=0,timerTick=null;var audioPoll=null;

/* Claim */
var claimStep=0;
function renderClaim(){
  var g=$('claimGrid');g.innerHTML='';
  if(claimStep===0){
    $('claimTitle').textContent='个人资料';
    g.innerHTML='<div style="grid-column:span 2;text-align:center;padding:8px"><button onclick="claimStep=1;renderClaim()" style="background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 24px;font-size:14px;cursor:pointer">下一步：选阵营 →</button></div>';

    $('claimTitle').textContent='选择阵营';

async function claimSeat(role){
  myName=$('pfName').value.trim()||'Debater-'+Math.random().toString(36).slice(2,5);myAvatar=$('pfAvatar').value.trim();

    fPush(fr('rooms/'+channel+'/audience'),{uid:myUid,displayName:myName,avatar:myAvatar,ts:Date.now()});
