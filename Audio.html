<style>
:root{
  --accent:#1a73e8;--accent-2:#1557b0;--accent-soft:rgba(26,115,232,.12);
  --pro:#4285f4;--con:#ea4335;--judge:#fbbc04;--ok:#34a853;
  --bg:#f8f9fa;--fg:#202124;--muted:#5f6368;--line:#dadce0;--line-2:#e8eaed;
  --r:10px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:14px;color:var(--fg);background:var(--bg);height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
/* Claim */
.claim{position:fixed;inset:0;background:url('background5.jpeg') center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:20px}
.claim-card{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:24px;padding:36px 32px 28px;box-shadow:0 8px 32px rgba(0,0,0,.15);max-width:380px;width:100%;position:relative;overflow:hidden}
.claim-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--pro),var(--accent),var(--con))}
.claim-icon{font-size:48px;text-align:center;margin-bottom:8px}
.claim h2{font-size:22px;margin-bottom:24px;color:var(--fg);font-weight:600;text-align:center}
.claim input{border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;font-size:14px;width:100%;margin-bottom:12px;transition:border-color 150ms,box-shadow 150ms;background:var(--bg)}
.claim input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fff}
.claim-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:100%;margin-top:12px}
.cb{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:16px;text-align:center;cursor:pointer;font-size:14px;font-weight:600;color:var(--fg);transition:all .18s ease}
.cb.pro{border-color:var(--pro);color:var(--pro)}.cb.con{border-color:var(--con);color:var(--con)}.cb.judge{border-color:var(--judge);color:#b08000}.cb.aud{border-color:var(--muted);color:var(--muted);grid-column:span 2}
.cb:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.cb.pro:hover{background:#e8f0fe}.cb.con:hover{background:#fce8e6}.cb.judge:hover{background:#fef7e0}.cb.aud:hover{background:#f1f3f4}
.cb:active{transform:translateY(0) scale(.98)}
.cb:disabled{opacity:.3;cursor:default;transform:none;box-shadow:none}
.cs{color:var(--muted);font-size:13px;margin-top:16px;text-align:center;max-width:400px;padding:8px 12px;border-radius:8px;background:var(--bg);transition:.2s}.cs.err{color:var(--con);background:#fce8e6}
.rb{background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:13px;cursor:pointer;margin-top:12px;padding:8px 16px;transition:.15s;width:auto;align-self:center}
.rb:hover{background:#f1f3f4;border-color:var(--accent);color:var(--accent)}
.fb-fb{margin-top:16px;text-align:center;display:none}.fb-fb input{width:100%;margin-bottom:8px}.fb-fb button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;font-weight:600;transition:.15s;width:100%}
.fb-fb button:hover{background:var(--accent-2);box-shadow:0 2px 8px rgba(26,115,232,.4)}
/* Room */
.room{display:none;flex:1;flex-direction:column;overflow:hidden}
.topic-bar{background:#fff;padding:10px 16px;text-align:center;border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.topic-bar .topic{font-size:24px;font-weight:700;color:var(--fg)}
.topic-bar .vs{font-size:11px;color:var(--muted);margin-top:2px}
.judge-row{display:flex;justify-content:center;padding:8px;background:#fef7e0;border-bottom:1px solid #f0e0a0}
.main-row{flex:1;display:flex;overflow:hidden}
.team{flex:1;padding:12px;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center}
.team.pro{background:#e8f0fe}.team.con{background:#fce8e6}
.center-panel{flex:0 0 300px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:8px}
/* Avatar */
.avatar{width:112px;height:112px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:#fff;overflow:hidden;position:relative;border:2px solid transparent;transition:.3s}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar video{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar.speaking{border-color:var(--ok);box-shadow:0 0 16px rgba(52,168,83,.7);animation:avpulse 1.2s ease-in-out infinite}@keyframes avpulse{0%,100%{box-shadow:0 0 8px rgba(52,168,83,.4)}50%{box-shadow:0 0 20px rgba(52,168,83,.85)}}
.avatar.muted{opacity:.4}
.avatar.judge{width:84px;height:84px;font-size:28px;background:var(--judge);color:#5f4500}
.debater{text-align:center}
.debater .name{font-size:16px;font-weight:600;color:var(--fg);margin-top:6px}
.debater .role{font-size:12px;color:var(--muted)}
.debater .status{font-size:12px;margin-top:2px}
.debater .status.on{color:var(--ok)}.debater .status.off{color:#999}
.debater .perm{font-size:10px;margin-top:1px}.debater .perm.y{color:var(--ok)}.debater .perm.n{color:#999}
.perm-btn{background:#f1f3f4;border:0;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;color:var(--fg);transition:.15s}
.perm-btn.on{background:var(--ok);color:#fff}.perm-btn.off{background:#f1f3f4;color:var(--muted)}
.perm-btn:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.audio-bar{width:84px;height:8px;background:var(--line-2);border-radius:6px;margin-top:6px;overflow:hidden;border:1px solid var(--line)}
.mic-pulse{width:100px;height:10px;background:var(--line-2);border-radius:6px;overflow:hidden;border:1px solid var(--line);margin:0 8px;flex-shrink:0}
.mic-pulse-fill{height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--accent));transition:width .08s}
.audio-fill{height:100%;width:0;background:var(--ok);transition:width .1s}
/* Timer */
.timer-num{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--fg);line-height:1}
.timer-num.warn{color:#e37400}.timer-num.done{color:var(--con)}
.progress-track{width:240px;height:8px;background:var(--line-2);border-radius:6px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;background:var(--ok);transition:width 1s linear}
.progress-fill.warn{background:#e37400}.progress-fill.done{background:var(--con)}
/* Judge controls — Google Material Filled */
.judge-ctrl{display:none;gap:6px;margin-top:8px}
.judge-ctrl button{background:var(--accent);color:#fff;border:0;border-radius:var(--r);padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s ease}
.judge-ctrl button:hover{background:var(--accent-2);box-shadow:0 4px 12px rgba(26,115,232,.35);transform:translateY(-1px)}
.judge-ctrl button:active{transform:translateY(0) scale(.98)}
.now-speaking{font-size:12px;color:var(--ok);font-weight:600;text-align:center;margin-top:4px}
.next-up{font-size:11px;color:var(--muted);text-align:center}
/* Chat */
.chat-bar{height:120px;display:flex;flex-direction:column;background:#fff;border-top:1px solid var(--line)}
.chat-head{padding:4px 12px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line-2)}
.chat-list{flex:1;overflow-y:auto;padding:4px 12px}
.chat-msg{font-size:12px;margin:2px 0}.chat-msg b{color:var(--pro);margin-right:3px}.chat-msg.me b{color:var(--ok)}
.chat-msg.sys{color:var(--muted);font-size:11px;font-style:italic}
.chat-input{display:flex;gap:4px;padding:4px}
.chat-input input{flex:1;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px}
.chat-input input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.chat-input button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.chat-input button:hover{background:var(--accent-2)}
/* Footer — Google Material Filled buttons */
.footer{background:#fff;padding:8px 14px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.footer button{background:var(--accent);color:#fff;border:0;border-radius:var(--r);padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s ease}
.footer button:hover{background:var(--accent-2);box-shadow:0 4px 12px rgba(26,115,232,.35);transform:translateY(-1px)}
.footer button:active{transform:translateY(0) scale(.98)}
#leaveBtn{background:#fff;color:var(--con);border:1px solid var(--con)}
#leaveBtn:hover{background:#fce8e6;border-color:var(--con);box-shadow:0 4px 12px rgba(234,67,53,.25)}
.footer .st{flex:1;font-size:11px;color:var(--muted)}.footer .st.ok{color:var(--ok)}.footer .st.err{color:var(--con)}
</style>
</head>
<body>

<div class="claim" id="claim">
  <div class="claim-card">
    <div class="claim-icon">🎤</div>
    <h2 id="claimTitle">个人资料</h2>
    <input id="pfName" placeholder="你的名字">

  <div class="main-row">

      <div class="debater"><div class="avatar" id="av-Pro-1">P1</div><div class="audio-bar"><div class="audio-fill" id="bar-Pro-1"></div></div><div class="name" id="nm-Pro-1">空</div><div class="role">Pro-1 一辩</div><div class="status" id="st-Pro-1">—</div></div>
      <div class="debater"><div class="avatar" id="av-Pro-2">P2</div><div class="audio-bar"><div class="audio-fill" id="bar-Pro-2"></div></div><div class="name" id="nm-Pro-2">空</div><div class="role">Pro-2 二辩</div><div class="status" id="st-Pro-2">—</div></div>
      <div style="font-size:16px;color:var(--pro);font-weight:600;text-align:center;padding:6px" id="proPrep">Prep: 3:00</div>
    </div>
    <div class="center-panel">
      <div class="timer-num" id="timerNum">--:--</div>
      <div class="progress-track"><div class="progress-fill" id="progFill" style="width:100%"></div></div>
      <div class="now-speaking" id="nowSpeaking">等待开始</div>
      <div class="next-up" id="nextUp"></div>
      <div id="phaseSeq" style="font-size:10px;color:#888;max-height:90px;overflow:auto;margin-top:4px;text-align:left;padding:0 6px;line-height:1.3;border-top:1px solid #eee"></div>
      <div class="judge-ctrl" id="judgeCtrl">
        <button id="phPrev">←</button><button id="phNext">→</button>
        <button id="proPrepBtn" style="background:var(--pro)">正方 Prep</button>
        <button id="conPrepBtn" style="background:var(--con)">反方 Prep</button>
        <button id="stopPrepBtn" style="background:#5f6368">⏹ 停止 Prep</button>
        <button id="autoAdvBtn">🔗 连续</button>
        <button id="tStart">▶</button><button id="tPause">⏸</button><button id="tReset">↺</button>
      </div>
      <input id="topicInput" placeholder="辩题（所有人可设置）" style="width:260px;border:1px solid #d0d4e0;border-radius:6px;padding:4px 8px;font-size:12px;margin-top:4px">
      <div id="permPanel" style="margin-top:8px;text-align:center">
        <div style="font-size:11px;color:#888;margin-bottom:4px">操控权限（主持人/Judge 管理）</div>
        <div id="permBtns" style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center"></div>
      </div>
    </div>
    <div class="team con">
      <div class="debater"><div class="avatar" id="av-Con-1">C1</div><div class="audio-bar"><div class="audio-fill" id="bar-Con-1"></div></div><div class="name" id="nm-Con-1">空</div><div class="role">Con-1 一辩</div><div class="status" id="st-Con-1">—</div></div>
      <div class="debater"><div class="avatar" id="av-Con-2">C2</div><div class="audio-bar"><div class="audio-fill" id="bar-Con-2"></div></div><div class="name" id="nm-Con-2">空</div><div class="role">Con-2 二辩</div><div class="status" id="st-Con-2">—</div></div>
      <div style="font-size:16px;color:var(--con);font-weight:600;text-align:center;padding:6px" id="conPrep">Prep: 3:00</div>
    </div>
  </div>
  <div class="chat-bar">
    <div class="chat-head">聊天</div>

  </div>
  <div class="footer">
    <button id="micAllBtn">🎤 全员</button>
    <button id="micTeamBtn">🎤 队内</button>
    <div class="mic-pulse" id="micPulse"><div class="mic-pulse-fill" id="micPulseFill"></div></div>
    <button id="camBtn">📹 摄像</button>
    <button id="switchBtn">🔄 换座位</button>
    <button id="simBtn">👥 模拟4人</button>
    <button id="leaveBtn">离开</button>
    <div class="st" id="stLine">Ready</div>
  </div>
</div>

<script>
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function setAvatar(role,url,name){
  var av=$('av-'+role);if(!av)return;
  var fb=(name||role).charAt(0).toUpperCase();
  if(url){av.innerHTML='';var img=document.createElement('img');img.src=url;img.onerror=function(){av.textContent=fb};av.appendChild(img)}

}
/* Config */
var APP_ID='6fb557c64dc04c578ea45bbc0f29cac0';
var UID={'Pro-1':101,'Pro-2':102,'Con-1':201,'Con-2':202,'Judge':301,'Audience':401};

/* Prep is NOT a phase — it's a per-team cumulative 3:00 resource usable between speeches (NSDA 2025-2026). Audio routing when a team's Prep is running: only hear teammate. */
var PREP_SUB={'Pro-1':['Pro-2'],'Pro-2':['Pro-1'],'Con-1':['Con-2'],'Con-2':['Con-1'],'Judge':[],'Audience':[]};
var PREP_SEC=180;
/* Token — fetch from server (Code.gs Web App). App Cert stays in Code.gs, not here. */
async function mkToken(cn,uid){
  var url=typeof WEB_APP_URL!=='undefined'?WEB_APP_URL:'';
  if(!url) throw new Error('WEB_APP_URL not set in firebase-config.js');
  var resp=await fetch(url+'?channel='+encodeURIComponent(cn)+'&uid='+uid);

/* State */
var params=new URLSearchParams(location.search);var channel=params.get('channel')||'pfdebate-default';var fbUrl=params.get('fbUrl')||'';
var myRole=null,myUid=0,myName='',myAvatar='';var seats={},curPhase=1,desiredSub=new Set();

var autoAdvance=false,autoAdvanced=false; // role → true/false (default true if not set)
function canControl(){return myRole!==null&&myRole!=='Audience'&&perms[myRole]!==false}
var fb=null,fm=null,fd=null;
async function ensureFB(url){if(fd)return fd;var m=await Promise.all([import('https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js'),import('https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js')]);fm=m;var app=m[0].initializeApp({databaseURL:url});fd=m[1].getDatabase(app);try{await m[2].signInAnonymously(m[2].getAuth(app));console.log('anon auth ok')}catch(e){console.log('anon auth failed',e)}return fd}
var roomListeners=[];function fr(p){return fm[1].ref(fd,p)}function fOn(r,cb){var u=fm[1].onValue(r,cb);roomListeners.push(u);return u}function fSet(r,v){fm[1].set(r,v)}function fPush(r,v){fm[1].push(r,v)}function fTxn(r,fn){fm[1].runTransaction(r,fn)}
/* Claim */
var claimStep=0;
function renderClaim(){
  var g=$('claimGrid');g.innerHTML='';
  if(claimStep===0){
    $('claimTitle').textContent='个人资料';
    g.innerHTML='<div style="grid-column:span 2;text-align:center;padding:8px"><button onclick="claimStep=1;renderClaim()" style="background:var(--pro);color:#fff;border:0;border-radius:var(--r);padding:10px 24px;font-size:14px;font-weight:600;cursor:pointer">下一步：选阵营 →</button></div>';
  }else if(claimStep===1){
    $('claimTitle').textContent='选择阵营';
    [['正方 Pro','pro'],['反方 Con','con'],['裁判 Judge','judge'],['观众 Audience','aud']].forEach(function(it){
      var b=document.createElement('button');b.className='cb '+it[1];b.textContent=it[0];b.onclick=function(){if(it[1]==='judge'){claimSeat('Judge')}else if(it[1]==='aud'){claimSeat('Audience')}else{claimStep=it[1];renderClaim()}};g.appendChild(b)});

    var bk=document.createElement('button');bk.className='rb';bk.textContent='← 返回';bk.onclick=function(){claimStep=1;renderClaim()};g.appendChild(bk);
