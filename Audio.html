<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
(function(){var U=['https://cdn.jsdelivr.net/npm/agora-rtc-sdk-ng@4.24.8/dist/AgoraRTC_N-production.js','https://unpkg.com/agora-rtc-sdk-ng@4.24.8/dist/AgoraRTC_N-production.js','https://download.agora.io/sdk/release/AgoraRTC_N-4.21.0.js'];
function t(i){if(i>=U.length){window._af=true;return}var s=document.createElement('script');s.src=U[i];s.onload=function(){window._al=true};s.onerror=function(){s.remove();t(i+1)};document.head.appendChild(s)}t(0)})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px;color:#162033;background:#0d1a2e;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:#15243c;padding:8px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(149,173,214,.2)}
.phase-label{flex:1;font-size:14px;font-weight:600;color:#4f8ef7}
.timer-box{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:#e9eef7;background:#1d3050;padding:4px 12px;border-radius:6px;min-width:80px;text-align:center}
.timer-box.warn{color:#e57b7b}.timer-box.done{color:#fff;background:#dc2626;animation:p 1s infinite}@keyframes p{50%{opacity:.5}}
.judge-controls{display:flex;gap:4px}
.judge-controls button{background:#1d3050;color:#e9eef7;border:1px solid rgba(149,173,214,.2);border-radius:4px;padding:4px 8px;font-size:11px;cursor:pointer}
.judge-controls button:hover{background:#2a4060}
.main{flex:1;display:flex;overflow:hidden}
.seats{flex:1;padding:10px;overflow:auto}
.seat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:600px;margin:0 auto}
.seat{background:#15243c;border:1px solid rgba(149,173,214,.15);border-radius:8px;padding:10px;text-align:center;min-height:70px;display:flex;flex-direction:column;justify-content:center}
.seat.pro{border-color:rgba(79,142,247,.3)}.seat.con{border-color:rgba(220,38,38,.3)}.seat.judge{border-color:rgba(255,193,7,.3)}.seat.audience{border-color:rgba(149,173,214,.1);grid-column:span 2}
.seat-name{font-size:11px;color:#94a8c6;margin-bottom:2px}
.seat-occupant{font-size:13px;font-weight:600;color:#e9eef7}
.seat-live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#333;margin-left:4px}
.seat-live.on{background:#1b873f;animation:pulse 1.5s infinite}@keyframes pulse{50%{opacity:.4}}
.seat-claim{background:#2563eb;color:#fff;border:0;border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer;margin-top:4px}
.seat-claim:hover{background:#1d4ed8}
.seat-empty{color:#5d6f8c;font-size:11px}
.chat{width:280px;background:#0d1a2e;border-left:1px solid rgba(149,173,214,.15);display:flex;flex-direction:column}
.chat-header{padding:6px 10px;font-size:11px;color:#94a8c6;border-bottom:1px solid rgba(149,173,214,.1)}
.chat-list{flex:1;overflow-y:auto;padding:6px 10px}
.chat-msg{font-size:12px;color:#e9eef7;margin:4px 0;line-height:1.4}
.chat-msg b{color:#4f8ef7;margin-right:4px}.chat-msg.me b{color:#1b873f}
.chat-msg.sys{color:#5d6f8c;font-style:italic;font-size:11px}
.chat-input{display:flex;gap:4px;padding:6px}
.chat-input input{flex:1;background:#15243c;border:1px solid rgba(149,173,214,.15);border-radius:4px;padding:5px 8px;color:#e9eef7;font-size:12px}
.chat-input button{background:#2563eb;color:#fff;border:0;border-radius:4px;padding:5px 10px;font-size:12px;cursor:pointer}
.footer{background:#15243c;padding:6px 12px;display:flex;align-items:center;gap:8px;border-top:1px solid rgba(149,173,214,.2)}
.footer button{background:#1d3050;color:#e9eef7;border:1px solid rgba(149,173,214,.2);border-radius:4px;padding:5px 10px;font-size:12px;cursor:pointer}
.footer .status{flex:1;font-size:11px;color:#5d6f8c}
.footer .status.ok{color:#1b873f}.footer .status.err{color:#e57b7b}
.claim-screen{position:fixed;inset:0;background:#0d1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:20px}
.claim-screen h2{color:#e9eef7;font-size:18px;margin-bottom:16px}
.claim-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:400px}
.claim-btn{background:#15243c;border:2px solid rgba(149,173,214,.2);border-radius:8px;padding:16px;text-align:center;cursor:pointer;color:#e9eef7;font-size:14px;font-weight:600}
.claim-btn.pro{border-color:#4f8ef7}.claim-btn.con{border-color:#dc2626}.claim-btn.judge{border-color:#ffc107}.claim-btn.audience{border-color:#666;grid-column:span 2}
.claim-btn:hover{background:#1d3050}.claim-btn:disabled{opacity:.3;cursor:not-allowed}
.claim-btn .desc{font-size:10px;color:#5d6f8c;font-weight:400;margin-top:2px}
</style>
</head>
<body>

<div class="claim-screen" id="claimScreen">
  <h2>选择你的席位</h2>
  <div class="claim-grid" id="claimGrid"></div>
</div>

<div class="header" id="roomHeader" style="display:none">
  <div class="phase-label" id="phaseLabel">等待赛程…</div>
  <div class="timer-box" id="timerBox">--:--</div>
  <div class="judge-controls" id="judgeControls" style="display:none">
    <button id="phasePrev">←</button>
    <button id="phaseNext">→</button>
    <button id="timerStart">▶</button>
    <button id="timerPause">⏸</button>
    <button id="timerReset">↺</button>
  </div>
</div>

<div class="main" id="roomMain" style="display:none">
  <div class="seats">
    <div class="seat-grid" id="seatGrid"></div>
  </div>
  <div class="chat">
    <div class="chat-header">聊天</div>
    <div class="chat-list" id="chatList"></div>
    <div class="chat-input">
      <input id="chatInput" placeholder="发消息…">
      <button id="chatSend">发送</button>
    </div>
  </div>
</div>

<div class="footer" id="roomFooter" style="display:none">
  <button id="muteBtn">🎤 静音</button>
  <button id="leaveBtn">离开</button>
  <div class="status" id="statusLine">Ready.</div>
</div>

<script>
var $=function(id){return document.getElementById(id)};
function setStatus(m,c){var s=$('statusLine');s.textContent=m;s.className='status '+(c||'')}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}

/* ===== CONFIG ===== */
var AGORA_APP_ID='6fb557c64dc04c578ea45bbc0f29cac0';
var AGORA_APP_CERT='8d95c2dad6214253b87e55592de978da';
var ROLES=['Pro-1','Pro-2','Con-1','Con-2','Judge','Audience'];
var UID_MAP={'Pro-1':101,'Pro-2':102,'Con-1':201,'Con-2':202,'Judge':301,'Audience':401};
var ROLE_OF_UID={101:'Pro-1',102:'Pro-2',201:'Con-1',202:'Con-2',301:'Judge'};
var PHASES=[
  {n:1,name:'Pro Constructive',pub:['Pro-1'],sub:{'Pro-1':[],'Pro-2':'all','Con-1':'all','Con-2':'all','Judge':'all','Audience':'all'},sec:240},
  {n:2,name:'Con Constructive',pub:['Con-1'],sub:{'Pro-1':'all','Pro-2':'all','Con-1':[],'Con-2':'all','Judge':'all','Audience':'all'},sec:240},
  {n:3,name:'First Crossfire',pub:['Pro-1','Con-1'],sub:{'Pro-1':['Con-1'],'Pro-2':'all','Con-1':['Pro-1'],'Con-2':'all','Judge':'all','Audience':'all'},sec:180},
  {n:4,name:'Pro Rebuttal',pub:['Pro-2'],sub:{'Pro-1':'all','Pro-2':[],'Con-1':'all','Con-2':'all','Judge':'all','Audience':'all'},sec:240},
  {n:5,name:'Con Rebuttal',pub:['Con-2'],sub:{'Pro-1':'all','Pro-2':'all','Con-1':'all','Con-2':[],'Judge':'all','Audience':'all'},sec:240},
  {n:6,name:'Second Crossfire',pub:['Pro-2','Con-2'],sub:{'Pro-1':'all','Pro-2':['Con-2'],'Con-1':'all','Con-2':['Pro-2'],'Judge':'all','Audience':'all'},sec:180},
  {n:7,name:'Pro Summary',pub:['Pro-1'],sub:{'Pro-1':[],'Pro-2':'all','Con-1':'all','Con-2':'all','Judge':'all','Audience':'all'},sec:180},
  {n:8,name:'Con Summary',pub:['Con-1'],sub:{'Pro-1':'all','Pro-2':'all','Con-1':[],'Con-2':'all','Judge':'all','Audience':'all'},sec:180},
  {n:9,name:'Grand Crossfire',pub:['Pro-1','Pro-2','Con-1','Con-2'],sub:{'Pro-1':'all','Pro-2':'all','Con-1':'all','Con-2':'all','Judge':'all','Audience':'all'},sec:180},
  {n:10,name:'Pro Final Focus',pub:['Pro-2'],sub:{'Pro-1':'all','Pro-2':[],'Con-1':'all','Con-2':'all','Judge':'all','Audience':'all'},sec:120},
  {n:11,name:'Con Final Focus',pub:['Con-2'],sub:{'Pro-1':'all','Pro-2':'all','Con-1':'all','Con-2':[],'Judge':'all','Audience':'all'},sec:120},
  {n:12,name:'Prep (team-private)',pub:['Pro-1','Pro-2','Con-1','Con-2'],sub:{'Pro-1':['Pro-2'],'Pro-2':['Pro-1'],'Con-1':['Con-2'],'Con-2':['Con-1'],'Judge':[],'Audience':[]},sec:180}
];

/* ===== URL PARAMS ===== */
var params=new URLSearchParams(location.search);
var channel=params.get('channel')||'pfdebate-default';
var fbUrl=params.get('fbUrl')||'';
var myRole=null, myUid=0, myName='Debater-'+Math.random().toString(36).slice(2,5);

/* ===== AccessToken2 token port (Web Crypto) ===== */
function utf8Bytes(s){var u=unescape(encodeURIComponent(s));var b=[];for(var i=0;i<u.length;i++)b.push(u.charCodeAt(i));return b}
function concatBytes(a){var t=0;a.forEach(function(x){t+=x.length});var o=new Uint8Array(t);var f=0;a.forEach(function(x){o.set(x,f);f+=x.length});return o}
function bytesB64(b){var s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
function ByteBuf(){var b=[];this.putUint16=function(v){b.push(v&0xff,(v>>8)&0xff);return this};this.putUint32=function(v){b.push(v&0xff,(v>>8)&0xff,(v>>16)&0xff,(v>>>24)&0xff);return this};this.putBytes=function(a){var r=a instanceof Uint8Array?Array.from(a):a;this.putUint16(r.length);for(var i=0;i<r.length;i++)b.push(r[i]&0xff);return this};this.putString=function(s){return this.putBytes(utf8Bytes(s))};this.putTreeMapUInt32=function(m){var k=Object.keys(m);this.putUint16(k.length);for(var i=0;i<k.length;i++){this.putUint16(parseInt(k[i],10));this.putUint32(m[k[i]])}return this};this.pack=function(){return new Uint8Array(b)};return this}
async function hmac(k,m){var ck=await crypto.subtle.importKey('raw',k instanceof Uint8Array?k:new Uint8Array(k),{name:'HMAC',hash:'SHA-256'},false,['sign']);return new Uint8Array(await crypto.subtle.sign('HMAC',ck,m instanceof Uint8Array?m:new Uint8Array(m)))}
function adler32(b){var a=1,c=0;for(var i=0;i<b.length;i++){a=(a+b[i])%65521;c=(c+a)%65521}return((c<<16)|a)>>>0}
function zlibDeflate(d){var l=d.length,n=(~l)&0xffff,o=[0x78,0x01,0x01,l&0xff,(l>>8)&0xff,n&0xff,(n>>8)&0xff];for(var i=0;i<l;i++)o.push(d[i]);var ad=adler32(d);o.push((ad>>>24)&0xff,(ad>>16)&0xff,(ad>>8)&0xff,ad&0xff);return new Uint8Array(o)}
function packSvc(cn,uid,exp){var t=new ByteBuf().putUint16(1).pack();var p={1:exp,2:exp,3:exp,4:exp};var pb=new ByteBuf().putTreeMapUInt32(p).pack();var cnb=new ByteBuf().putString(cn).pack();var ub=new ByteBuf().putString(uid===0?'':String(uid)).pack();return concatBytes([t,pb,cnb,ub])}
async function buildToken(cn,uid){var ts=Math.floor(Date.now()/1000),exp=3600,salt=Math.floor(Math.random()*99999999)+1;var s1=await hmac(new ByteBuf().putUint32(ts).pack(),utf8Bytes(AGORA_APP_CERT));var sg=await hmac(new ByteBuf().putUint32(salt).pack(),s1);var svc=packSvc(cn,uid,exp);var si=concatBytes([new ByteBuf().putString(AGORA_APP_ID).putUint32(ts).putUint32(exp).putUint32(salt).putUint16(1).pack(),svc]);var sig=await hmac(sg,si);var ct=concatBytes([new ByteBuf().putBytes(sig).pack(),si]);return'007'+bytesB64(zlibDeflate(ct))}

/* ===== Firebase ===== */
var fb=null,fm=null,fd=null;
async function ensureFB(url){
  if(fd)return fd;
  var m=await Promise.all([import('https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js')]);
  fm=m;fd=m[1].getDatabase(m[0].initializeApp({databaseURL:url}));return fd;
}
function fbRef(path){return fm[1].ref(fd,path)}
function fbOn(ref,cb){fm[1].onValue(ref,cb)}
function fbSet(ref,val){fm[1].set(ref,val)}
function fbPush(ref,val){fm[1].push(ref,val)}
function fbTxn(ref,fn){fm[1].runTransaction(ref,fn)}

/* ===== State ===== */
var seats={};var currentPhase=1;var desiredSub=new Set();var client=null,mic=null;var timerEndsAt=0,timerDur=0,timerRunning=false,timerTick=null;

/* ===== Seat Claim ===== */
function renderClaimGrid(){
  var g=$('claimGrid');g.innerHTML='';
  ROLES.forEach(function(role){
    var btn=document.createElement('button');
    btn.className='claim-btn '+(role.startsWith('Pro')?'pro':role.startsWith('Con')?'con':role==='Judge'?'judge':'audience');
    var occ=seats[role];
    btn.innerHTML='<div>'+role+'</div><div class="desc">'+(occ?occ.displayName+' 已占':'点击选择')+'</div>';
    btn.disabled=!!occ;
    btn.addEventListener('click',function(){claimSeat(role)});
    g.appendChild(btn);
  });
}
async function claimSeat(role){
  if(seats[role])return;
  var claimed=false;
  await fbTxn(fbRef('rooms/'+channel+'/seats/'+role),function(cur){
    if(cur===null){cur={uid:myUid,displayName:myName,claimedAt:Date.now()};claimed=true;return cur}
    return;
  });
  if(claimed){
    myRole=role;myUid=UID_MAP[role]||Math.floor(Math.random()*900)+100;
    fbSet(fbRef('rooms/'+channel+'/roster/'+myUid),role);
    startRoom();
  }else{
    setStatus('席位被抢先了，选另一个', 'err');
    fbOn(fbRef('rooms/'+channel+'/seats'),function(s){seats=s.val()||{};renderClaimGrid()});
  }
}

/* ===== Start Room (after seat claimed) ===== */
async function startRoom(){
  $('claimScreen').style.display='none';
  $('roomHeader').style.display='flex';
  $('roomMain').style.display='flex';
  $('roomFooter').style.display='flex';
  if(myRole==='Judge'){$('judgeControls').style.display='flex'}
  renderSeats();
  // Agora join
  setStatus('加入音频频道…');
  if(typeof AgoraRTC==='undefined'){setStatus('Agora SDK 没加载', 'err');return}
  try{
    client=AgoraRTC.createClient({mode:'rtc',codec:'vp8'});
    client.on('user-published',onUserPublished);
    client.on('user-unpublished',onUserUnpublished);
    client.on('user-left',onUserLeft);
    var token=await buildToken(channel,myUid);
    await client.join(AGORA_APP_ID,channel,token,myUid);
    mic=await AgoraRTC.createMicrophoneAudioTrack();
    await client.publish(mic);
    mic.setMuted(true); // start muted; phase enforcement will unmute
    setStatus('已加入 ✓');
    // initial phase enforcement
    enforcePhase(currentPhase);
  }catch(e){setStatus('加入失败: '+e.message,'err')}
  // Firebase listeners
  fbOn(fbRef('rooms/'+channel+'/phase'),function(s){var v=s.val();if(v&&typeof v==='number'){currentPhase=v;enforcePhase(v);renderPhase()}});
  fbOn(fbRef('rooms/'+channel+'/seats'),function(s){seats=s.val()||{};renderSeats()});
  fbOn(fbRef('rooms/'+channel+'/timer'),function(s){var v=s.val();if(v){timerRunning=v.running;timerEndsAt=v.endsAt||0;timerDur=v.durationSec||0;renderTimer()}});
  fbOn(fbRef('rooms/'+channel+'/chat'),function(s){renderChat(s.val()||{})});
  // my name from roster
  if(myRole!=='Judge'&&myRole!=='Audience'){$('muteBtn').textContent='🎤 静音'}
}

/* ===== Agora event handlers ===== */
function roleOf(uid){return ROLE_OF_UID[uid]||(uid>=401?'Audience':'unknown')}
function onUserPublished(user,mediaType){
  if(mediaType!=='audio')return;
  var r=roleOf(user.uid);
  if(desiredSub.has(r)){
    client.subscribe(user,'audio').then(function(t){t.play()}).catch(function(){});
  }
}
function onUserUnpublished(user,mediaType){ /* SDK auto-releases subscribed tracks */ }
function onUserLeft(user){ renderSeats(); }

/* ===== Phase Enforcement ===== */
async function enforcePhase(phase){
  var rule=PHASES.find(function(p){return p.n===phase})||PHASES[0];
  // my mic
  var shouldPub=rule.pub.includes(myRole);
  if(mic){await mic.setMuted(!shouldPub)}
  // desired subscribe set
  var subRule=rule.sub[myRole]||[];
  desiredSub=new Set();
  if(subRule==='all'){rule.pub.forEach(function(r){if(r!==myRole)desiredSub.add(r)})}
  else if(Array.isArray(subRule)){subRule.forEach(function(r){desiredSub.add(r)})}
  // diff + apply
  if(client){
    for(var i=0;i<client.remoteUsers.length;i++){
      var u=client.remoteUsers[i];
      if(!u.hasAudio)continue;
      var r=roleOf(u.uid);
      var want=desiredSub.has(r);
      var has=!!u.audioTrack;
      if(want&&!has){try{var t=await client.subscribe(u,'audio');t.play()}catch(e){}}
      else if(!want&&has){try{await client.unsubscribe(u,'audio')}catch(e){}}
    }
  }
  renderPhase();
  renderSeats(); // update live dots
  addSysMsg('赛程: '+rule.name);
}

/* ===== UI Rendering ===== */
function renderPhase(){
  var rule=PHASES.find(function(p){return p.n===currentPhase})||PHASES[0];
  $('phaseLabel').textContent=rule.name+' — 开麦: '+rule.pub.join(', ');
}
function renderSeats(){
  var g=$('seatGrid');g.innerHTML='';
  var rule=PHASES.find(function(p){return p.n===currentPhase})||PHASES[0];
  ['Pro-1','Pro-2','Con-1','Con-2','Judge'].forEach(function(role){
    var d=document.createElement('div');
    d.className='seat '+(role.startsWith('Pro')?'pro':role.startsWith('Con')?'con':'judge');
    var occ=seats[role];
    var live=rule.pub.includes(role);
    d.innerHTML='<div class="seat-name">'+role+'</div>'+(occ?'<div class="seat-occupant">'+esc(occ.displayName)+'<span class="seat-live '+(live?'on':'')+'"></span></div>':'<div class="seat-empty">空</div>');
    g.appendChild(d);
  });
  var aud=document.createElement('div');aud.className='seat audience';
  var audList=Object.keys(seats).filter(function(k){return k==='Audience'}).map(function(k){return seats[k]}).filter(Boolean);
  aud.innerHTML='<div class="seat-name">观众 ('+audList.length+')</div><div class="seat-occupant">'+audList.map(function(a){return esc(a.displayName)}).join(', ')+'</div>';
  g.appendChild(aud);
}
function renderTimer(){
  var box=$('timerBox');
  function tick(){
    if(!timerRunning||!timerEndsAt){box.textContent='--:--';box.className='timer-box';return}
    var rem=Math.max(0,Math.round((timerEndsAt-Date.now())/1000));
    var m=Math.floor(rem/60),x=rem%60;
    box.textContent=(m<10?'0':'')+m+':'+(x<10?'0':'')+x;
    box.className='timer-box'+(rem<=30?' warn':'')+(rem<=0?' done':'');
  }
  if(timerTick)clearInterval(timerTick);
  tick();
  if(timerRunning)timerTick=setInterval(tick,1000);
}
function renderChat(msgs){
  var list=$('chatList');list.innerHTML='';
  var keys=Object.keys(msgs).sort();
  keys.forEach(function(k){
    var m=msgs[k];if(!m)return;
    var div=document.createElement('div');
    if(m.sys){div.className='chat-msg sys';div.textContent=m.text}
    else{div.className='chat-msg'+(m.uid===myUid?' me':'');div.innerHTML='<b>'+esc(m.displayName||'?')+':</b> '+esc(m.text)}
    list.appendChild(div);
  });
  list.scrollTop=list.scrollHeight;
}
function addSysMsg(text){fbPush(fbRef('rooms/'+channel+'/chat'),{sys:true,text:text,ts:Date.now()})}

/* ===== Judge controls ===== */
$('phaseNext').addEventListener('click',function(){
  var next=Math.min(12,currentPhase+1);
  fbSet(fbRef('rooms/'+channel+'/phase'),next);
  // arm timer for the new phase
  var rule=PHASES.find(function(p){return p.n===next});
  if(rule)fbSet(fbRef('rooms/'+channel+'/timer'),{running:false,endsAt:0,durationSec:rule.sec,label:rule.name});
});
$('phasePrev').addEventListener('click',function(){
  fbSet(fbRef('rooms/'+channel+'/phase'),Math.max(1,currentPhase-1));
});
$('timerStart').addEventListener('click',function(){
  var rule=PHASES.find(function(p){return p.n===currentPhase})||PHASES[0];
  fbSet(fbRef('rooms/'+channel+'/timer'),{running:true,endsAt:Date.now()+rule.sec*1000,durationSec:rule.sec,label:rule.name});
});
$('timerPause').addEventListener('click',function(){
  if(timerEndsAt){var rem=Math.max(0,Math.round((timerEndsAt-Date.now())/1000));
  fbSet(fbRef('rooms/'+channel+'/timer'),{running:false,endsAt:0,durationSec:rem,label:'paused'})}
});
$('timerReset').addEventListener('click',function(){
  var rule=PHASES.find(function(p){return p.n===currentPhase})||PHASES[0];
  fbSet(fbRef('rooms/'+channel+'/timer'),{running:false,endsAt:0,durationSec:rule.sec,label:rule.name});
  $('timerBox').textContent='--:--';
});

/* ===== Chat ===== */
$('chatSend').addEventListener('click',sendChat);
$('chatInput').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();sendChat()}});
function sendChat(){
  var t=$('chatInput').value.trim();if(!t)return;
  $('chatInput').value='';
  fbPush(fbRef('rooms/'+channel+'/chat'),{uid:myUid,displayName:myName,text:t,ts:Date.now()});
}

/* ===== Mic / Leave ===== */
$('muteBtn').addEventListener('click',function(){
  if(!mic)return;
  var muted=!mic.muted;mic.setMuted(muted);
  $('muteBtn').textContent=muted?'🔇 取消静音':'🎤 静音';
});
$('leaveBtn').addEventListener('click',function(){
  try{if(mic)mic.close()}catch(e){}
  try{if(client)client.leave()}catch(e){}
  // release seat
  if(myRole)fbSet(fbRef('rooms/'+channel+'/seats/'+myRole),null);
  if(myUid)fbSet(fbRef('rooms/'+channel+'/roster/'+myUid),null);
  window.close();
});

/* ===== Init ===== */
async function init(){
  if(!fbUrl){setStatus('缺少 Firebase URL（从侧边栏点链接进入）','err');return}
  setStatus('连接 Firebase…');
  try{await ensureFB(fbUrl)}catch(e){setStatus('Firebase 连接失败: '+e.message,'err');return}
  setStatus('Firebase 已连 ✓');
  // listen to seats for claim screen
  fbOn(fbRef('rooms/'+channel+'/seats'),function(s){seats=s.val()||{};renderClaimGrid()});
  // listen to phase for initial display
  fbOn(fbRef('rooms/'+channel+'/phase'),function(s){var v=s.val();if(v)currentPhase=v});
  // onDisconnect cleanup for seats
  var myTempUid=Math.floor(Math.random()*900)+100;
  renderClaimGrid();
}
init();
</script>
